<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Emblem lingkaran gelap berisi monogram V dari dua blade emas yang bertemu, dengan garis pulse merah oxblood melintang di tengah dan dua titik emas di ujung blade melambangkan dua co-creator.</desc>
